meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/bio_lite_top.sv
- dir::../src/bio_lite.sv
- dir::../src/spi_bio_bridge.sv
- dir::../src/spi_slave.v
- dir::../src/icg_gf180.sv
- dir::../src/sram_512x32.v
- dir::../src/picorv32.v
- dir::../src/regfifo.v
- dir::../src/pio_divider.v
- dir::../src/rst_sync.v

# NOTE: macro placement lives in the separate macros_5v.yaml (whole-
# memory-per-core). That file is correct as-is and is included by your
# existing flow wiring - do not merge it in here.

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# --- Area-friendly synthesis (racquet) : smaller netlist = less congestion ---
SYNTH_STRATEGY: "AREA 3"
SYNTH_SIZING: True
# Raise fanout limit so the resizer inserts FEWER fanout buffers.
MAX_FANOUT_CONSTRAINT: 25

CTS_APPLY_NDR: none

#GPL_CELL_PADDING: 2
#DPL_CELL_PADDING: 2


# CLOCK ROUTING LAYERS: REMOVED.
# The 0.5x1 racquet (same slot) does NOT force clock layers - it lets the
# router balance horizontal demand across Metal3 and Metal5. Forcing the
# clock onto M4/M5 was taking M5 horizontal capacity that signals need.
# (If you ever want it back: RT_CLOCK_MIN_LAYER / RT_CLOCK_MAX_LAYER.)

VERILOG_DEFINES:
- USE_GF180_SRAM


# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker
- gf180mcu_dpk_ip__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: 
  - clk_pad/Y
  - clk_PAD2CORE
  - i_chip_core.u_bio_lite.u_bio.core_clk

# NOTE: 50 = 20 MHz. The 0.5x1 racquet runs 100 (10 MHz). A tighter
# period drives more timing-fix buffers -> more M3 horizontal demand.
# If your spec allows, relaxing this toward 80-100 is the single biggest
# lever to cut the buffer count that is flooding Metal3.
CLOCK_PERIOD: 100

# --- Resizer margins : keep buffer count down ---
PL_RESIZER_HOLD_SLACK_MARGIN: 0.4
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3
PL_RESIZER_SETUP_SLACK_MARGIN: 0.25
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.2

# --- Repair tuning : STOP the post-route buffer bloat ---
# Previous run inserted 13,763 buffers (+19.2% area) and pushed wirelength
# to ~9.6M um, dumping horizontal wire onto the already-saturated Metal3.
# 5% margins overfix slew/cap and manufacture buffers -> set to 0.
DESIGN_REPAIR_MAX_SLEW_PCT: 20
DESIGN_REPAIR_MAX_CAP_PCT: 20
DESIGN_REPAIR_REMOVE_BUFFERS: True

# Keep post-GRT timing resize (racquet parity) but TURN OFF the post-GRT
# design-repair pass - that pass is the main source of the buffer bloat
# and the route->buffer->route loop that ran for hours.
#RUN_POST_GRT_RESIZER_TIMING: True
#RUN_POST_GRT_DESIGN_REPAIR: False

# Density: racquet 0.5x1 routes at 65; congestion here is layer-specific
# (Metal3), not density, so 60 is fine. Do NOT chase this lower.
PL_TARGET_DENSITY_PCT: 20
# Keep true so GRT completes and prints the GRT-0096 report. If it loops
# in "GRT-0101 extra iterations" for more than ~30 min, Ctrl-C and set
# this to false for a fast fail-and-report diagnostic run.
GRT_ALLOW_CONGESTION: True

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 20
PDN_CORE_RING_HWIDTH: 20
PDN_CORE_RING_CONNECT_TO_PADS: True
# PDN vertical stays on Metal4 - your custom pdn/pdn_cfg.tcl is hardwired
# for Metal4 macro straps; moving it to Metal2 caused PDN-0003. Leave it.
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]
#
# *** OPTIONAL NEXT LEVER (only if Metal3 still overflows) ***
# Metal3 is your bottleneck because horizontal signal routing shares it
# with the horizontal power straps. Moving the core horizontal PDN up to
# Metal5 frees Metal3 for signals:
#     PDN_CORE_HORIZONTAL_LAYER: Metal5
# Try this ONLY if the run below still shows large Metal3 overflow, and
# re-check PDN connectivity (PowerGridViolations / PDN-0110) afterwards.

# --- Macro keepouts : match 0.5x1 racquet (10 / 5) ---
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
FP_PDN_HORIZONTAL_HALO: 5
FP_PDN_VERTICAL_HALO: 5

# Do not error on magic DRC violations
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

KLAYOUT_DRC_THREADS: 1

KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
