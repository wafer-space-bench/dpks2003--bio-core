  # ============================================================
  # BIO-lite SRAM: 8x sram512x8 -> two 512x32 memories
  #
  # WHOLE-MEMORY-PER-CORE  (modeled on gregdavill/racquet, which
  # tapes out clean keeping every memory next to its own core).
  #
  #   TOP block    = ALL of core1's 512x32  (byte0..3)
  #   BOTTOM block = ALL of core0's 512x32  (byte0..3)
  #
  # WHY: picorv32 fetches a full 32-bit word every cycle, so each
  # core's 4 byte-slices share an address bus + 32 data bits. The
  # previous floorplan split each core's bytes top/bottom, forcing
  # that 32-bit bus to span the 2247 um channel -> M3 saturated
  # (GRT-0228). Keeping each core's 4 slices in one 2x2 block keeps
  # that bus inside ~864 x 971 um, next to the core that uses it.
  #
  # Coordinates and the 2x2 geometry are UNCHANGED from your
  # working FN floorplan - only the instance->slot assignment moved.
  #
  # ORIENTATION NOTE (verify, do not assume):
  #   Top block uses N    -> pins face DOWN into the centre channel.
  #   Bottom block uses FN -> this is the value that passed DPL for
  #   you. The pin edge SHOULD face UP toward core0's logic in the
  #   centre. Confirm with the ODB pin check (see chat) - if FN
  #   points the pins at the bottom die edge, switch the bottom
  #   block to FS and re-run. With the new buffer-discipline config,
  #   FS may now legalise where it didn't before.
  # ============================================================
  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # --- TOP block: core1's entire 512x32 (pins face DOWN) ---
      i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte0:
        location: [535.92,4170.88 ]
        orientation: N
      i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte1:
        location: [967.78, 4170.88]
        orientation: N
      i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte2:
        location: [535.92,3684.8]
        orientation: N
      i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte3:
        location: [967.78, 3684.8]
        orientation: N

      # --- BOTTOM block: core0's entire 512x32 (pins face UP) ---
      #i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte0:
      #  location: ["expr::500", "expr::480 + 0.5*932"]
      #  orientation: W
      #i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte1:
      #  location: ["expr::500", "expr::480 + 1.5*932"]
      #  orientation: W
      #i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte2:
      #  location: ["expr::500", "expr::480 + 2.5*932"]
      #  orientation: W
      #i_chip_core.u_bio_lite.u_bio.u_imem_core0.sram_byte3:
      #  location: ["expr::500", "expr::480 + 3.5*932"]
      #  orientation: W

